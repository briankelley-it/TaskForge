<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-label="TaskForge">
  <title>TaskForge</title>
  <defs>
    <linearGradient id="tfw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="tfw-ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <g transform="scale(1.5)">
    <rect width="32" height="32" rx="8" fill="url(#tfw-tile)"/>
    <g fill="#fff">
      <rect x="5" y="7.5" width="12.5" height="3.6" rx="1"/>
      <rect x="9.45" y="7.5" width="3.6" height="17" rx="1"/>
    </g>
    <g fill="url(#tfw-ember)">
      <rect x="17.5" y="7.5" width="9.5" height="3.6" rx="1"/>
      <rect x="17.5" y="7.5" width="3.6" height="17" rx="1"/>
      <rect x="17.5" y="14.6" width="7.5" height="3.2" rx="1"/>
    </g>
  </g>
  <text x="60" y="33" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.5" fill="#4338ca">Task<tspan fill="#f59e0b">Forge</tspan></text>
</svg>
