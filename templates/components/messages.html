{% if messages %}
  <div id="messages" class="mx-auto mt-4 w-full max-w-6xl space-y-2 px-4 sm:px-6 lg:px-8">
    {% for message in messages %}
      <div data-dismissible
           class="flex items-start justify-between gap-4 rounded-lg border px-4 py-3 text-sm
                  {% if message.level_tag == 'error' %}border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-950 dark:text-red-200
                  {% elif message.level_tag == 'warning' %}border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200
                  {% else %}border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950 dark:text-emerald-200{% endif %}">
        <span>{{ message }}</span>
        <button type="button" data-dismiss aria-label="Dismiss" class="opacity-60 hover:opacity-100">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
