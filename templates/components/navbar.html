<header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <nav class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 py-3 sm:px-6 lg:px-8">
    <a href="{% url 'home' %}" class="flex items-center gap-2 text-lg font-bold tracking-tight">
      {% include "components/logo.html" %}
      <span class="hidden min-[360px]:inline">TaskForge</span>
    </a>
    <div class="flex items-center gap-2 text-sm sm:gap-3">
      {% if user.is_authenticated %}
        <a href="{% url 'projects:dashboard' %}" class="link">Projects</a>
        <span class="hidden text-slate-500 md:inline dark:text-slate-400">{{ user.name }}</span>
      {% endif %}
      <button type="button" data-theme-toggle
              class="grid h-9 w-9 cursor-pointer place-items-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
              aria-label="Toggle dark mode" title="Toggle dark mode">
        {# Moon in light mode, sun in dark mode. #}
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn-secondary px-3">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'account_login' %}" class="link">Log in</a>
        <a href="{% url 'account_signup' %}" class="btn-primary px-3">Sign up</a>
      {% endif %}
    </div>
  </nav>
</header>
