<header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="{% url 'home' %}" class="flex items-center gap-2 text-lg font-bold tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-600 text-sm text-white">TF</span>
      TaskForge
    </a>
    <div class="flex items-center gap-3 text-sm">
      {% if user.is_authenticated %}
        <a href="{% url 'projects:dashboard' %}" class="link">Projects</a>
        <span class="hidden text-slate-500 sm:inline dark:text-slate-400">{{ user.name }}</span>
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn-secondary">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'account_login' %}" class="link">Log in</a>
        <a href="{% url 'account_signup' %}" class="btn-primary">Sign up</a>
      {% endif %}
    </div>
  </nav>
</header>
