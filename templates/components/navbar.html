{# Signed-out pages: a light, simple navbar. Signed-in pages use the sidebar and top bar. #}
<header class="sticky top-0 z-20 bg-canvas/85 backdrop-blur-md dark:bg-canvas-dark/85">
  <nav class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 py-4 sm:px-6 lg:px-8">
    <a href="{% url 'home' %}" class="flex items-center gap-2.5 text-lg font-bold tracking-tight">
      {% include "components/logo.html" with prefix="nav" %}
      <span class="hidden min-[360px]:inline">TaskForge</span>
    </a>
    <div class="flex items-center gap-2 text-sm">
      <button type="button" data-theme-toggle class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="dark:hidden">{% include "components/icon.html" with name="moon" %}</span>
        <span class="hidden dark:inline">{% include "components/icon.html" with name="sun" %}</span>
      </button>
      <a href="{% url 'account_login' %}" class="btn-secondary">Log in</a>
      <a href="{% url 'account_signup' %}" class="btn-primary">Sign up</a>
    </div>
  </nav>
</header>
