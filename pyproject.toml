[project]
name = "taskforge"
version = "0.1.0"
description = "Project and task management for small teams, built with Django and HTMX."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "activity", "config", "projects", "tasks", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
# --ds wins over a DJANGO_SETTINGS_MODULE env var (docker-compose sets dev), so tests always use test settings.
addopts = "--strict-markers --ds=config.settings.test"
filterwarnings = [
    # Whitenoise warns when collectstatic hasn't run; tests don't need collected files.
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["accounts", "activity", "config", "projects", "tasks"]
omit = [
    "*/migrations/*",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/prod.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
