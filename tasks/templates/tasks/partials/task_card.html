<li id="task-{{ task.pk }}"
    data-move-url="{% url 'tasks:move' project.pk task.pk %}"
    hx-get="{% url 'tasks:update' project.pk task.pk %}" hx-target="#modal"
    hx-trigger="click, keyup[key=='Enter']"
    role="button" tabindex="0" aria-label="Edit {{ task.title }}"
    class="card cursor-grab select-none p-3 transition hover:border-indigo-300 active:cursor-grabbing dark:hover:border-indigo-700">
  <p class="text-sm font-medium leading-snug">{{ task.title }}</p>
  <div class="mt-2 flex flex-wrap items-center gap-2 text-xs">
    <span class="rounded px-1.5 py-0.5 font-medium
      {% if task.priority == 'high' %}bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300
      {% elif task.priority == 'medium' %}bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300
      {% else %}bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300{% endif %}">{{ task.get_priority_display }}</span>
    {% if task.due_date %}
      <span class="{% if task.is_overdue %}font-semibold text-red-600 dark:text-red-400{% else %}text-slate-500 dark:text-slate-400{% endif %}">
        {% if task.is_overdue %}Overdue · {% endif %}{{ task.due_date|date:"M j" }}
      </span>
    {% endif %}
    {% if task.assignee %}
      <span class="ml-auto grid h-6 w-6 place-items-center rounded-full bg-indigo-600 text-[10px] font-semibold uppercase text-white"
            title="Assigned to {{ task.assignee.name }}">{{ task.assignee.name|slice:":2" }}</span>
    {% endif %}
  </div>
</li>
