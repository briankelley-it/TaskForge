{# Replaces itself every minute (hx-trigger "every 60s"), so the count stays current. #}
<span id="notification-badge" hx-get="{% url 'notifications:badge' %}" hx-trigger="every 60s" hx-target="this" hx-swap="outerHTML"
      {% if unread %}class="absolute right-1.5 top-1.5 grid h-4 min-w-4 place-items-center rounded-full bg-indigo-500 px-1 text-[9px] font-semibold text-white ring-2 ring-canvas dark:ring-canvas-dark"{% endif %}>{% if unread %}{% if unread > 99 %}99+{% else %}{{ unread|stringformat:"02d" }}{% endif %}<span class="sr-only"> unread</span>{% endif %}</span>
